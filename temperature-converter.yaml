apiVersion: apps/v1
kind: Deployment
metadata:
  name: temperature-converter
  labels:
    app: temperature-converter
spec:
  replicas: 1
  selector:
    matchLabels:
      app: temperature-converter
  template:
    metadata:
      labels:
        app: temperature-converter
    spec:
      containers:
        - name: temperature-converter
          image: rthless/temperature-converter:latest
          imagePullPolicy: IfNotPresent
          env:
            - name: DISPLAY
              value: host.docker.internal:0.0
          volumeMounts:
            - name: database-data
              mountPath: /app/data
      volumes:
        - name: database-data
          persistentVolumeClaim:
            claimName: temperature-converter-data
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: temperature-converter-data
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi